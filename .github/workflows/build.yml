name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true
      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  ios:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # 提前更新依赖，绕过 Python 脚本的强制锁文件校验
      - run: flutter pub get
      - run: python scripts/build_ios.py ${{ matrix.arguments }}
      
      # 修正 IPA 的包结构，确保 TrollStore / AltStore 可以正常安装
      - name: Fix IPA packaging structure
        run: |
          echo "开始修复 IPA 目录结构..."
          APP_PATH=$(find build/ios/iphoneos -type d -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "找到 .app 文件: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            
            IPA_FILE="dist/ios/${{ matrix.edition }}-ios-unsigned.ipa"
            rm -f "$IPA_FILE"
            
            zip -qr "$IPA_FILE" Payload
            echo "成功生成标准结构的 $IPA_FILE"
            rm -rf Payload
          else
            echo "::error::未找到 .app 目录，请检查上一步的编译日志。"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [ios]
    if: always() && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          for directory in artifacts/*/; do
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          
          # 精简后的 Release Notes，只显示 iOS 相关信息
          {
            printf '%s\n\n' "版本 ${version}。两个版本功能相同，区别只在站源范围，按需选择："
            printf '%s\n' "- 红果鉴 hongguojian：仅红果站源"
            printf '%s\n' "- 真果鉴 zhenguojian：全部站源"
            printf '\n%s\n' "iOS（未签名，需自行签名后才能安装）："
            printf '%s\n' "- *-ios-unsigned.ipa：未签名 IPA，用 AltStore / Sideloadly / TrollStore 等工具自签后安装"
            printf '%s\n' "- *-ios-unsigned-app.zip：未签名 Runner.app 压缩包，供自行签名 / 打包使用"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
          } > notes.md
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "红果鉴 / 真果鉴 ${version} (iOS)" --notes-file notes.md
            # 清理上一次构建留下、本轮已不再产出的附件，避免下载到过期文件。
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "release/$name" ]; then
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
          else
            gh release create "$tag" release/* --title "红果鉴 / 真果鉴 ${version} (iOS)" --notes-file notes.md
          fi
